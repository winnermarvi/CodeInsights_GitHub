    <body>
        <div class="card" style="width: 100%">
            
            
            <div id="mynetwork" class="card-body"></div>
        </div>

        
        

        <script type="text/javascript">

              // initialize global variables.
              var edges;
              var nodes;
              var allNodes;
              var allEdges;
              var nodeColors;
              var originalNodes;
              var network;
              var container;
              var options, data;
              var filter = {
                  item : '',
                  property : '',
                  value : []
              };

              

              

              // This method is responsible for drawing the graph, returns the drawn network
              function drawGraph() {
                  var container = document.getElementById('mynetwork');

                  

                  // parsing and collecting nodes and edges from the python
                  nodes = new vis.DataSet([{"color": "#4FC3F7", "font": {"color": "white"}, "id": "chat", "label": "chat", "shape": "dot", "title": "chat"}, {"color": "#4FC3F7", "font": {"color": "white"}, "id": "chunking", "label": "chunking", "shape": "dot", "title": "chunking"}, {"color": "#4FC3F7", "font": {"color": "white"}, "id": "code_understanging", "label": "code_understanging", "shape": "dot", "title": "code_understanging"}, {"color": "#4FC3F7", "font": {"color": "white"}, "id": "database", "label": "database", "shape": "dot", "title": "database"}, {"color": "#4FC3F7", "font": {"color": "white"}, "id": "embedding", "label": "embedding", "shape": "dot", "title": "embedding"}, {"color": "#4FC3F7", "font": {"color": "white"}, "id": "graph", "label": "graph", "shape": "dot", "title": "graph"}, {"color": "#4FC3F7", "font": {"color": "white"}, "id": "impact", "label": "impact", "shape": "dot", "title": "impact"}, {"color": "#4FC3F7", "font": {"color": "white"}, "id": "ingestion", "label": "ingestion", "shape": "dot", "title": "ingestion"}, {"color": "#4FC3F7", "font": {"color": "white"}, "id": "rag", "label": "rag", "shape": "dot", "title": "rag"}, {"color": "#4FC3F7", "font": {"color": "white"}, "id": "repository", "label": "repository", "shape": "dot", "title": "repository"}, {"color": "#4FC3F7", "font": {"color": "white"}, "id": "search", "label": "search", "shape": "dot", "title": "search"}]);
                  edges = new vis.DataSet([{"arrows": "to", "from": "chat", "label": "DEPENDS_ON", "to": "rag"}, {"arrows": "to", "from": "chunking", "label": "DEPENDS_ON", "to": "code_understanging"}, {"arrows": "to", "from": "code_understanging", "label": "DEPENDS_ON", "to": "ingestion"}, {"arrows": "to", "from": "impact", "label": "DEPENDS_ON", "to": "graph"}, {"arrows": "to", "from": "rag", "label": "DEPENDS_ON", "to": "chat"}, {"arrows": "to", "from": "rag", "label": "DEPENDS_ON", "to": "search"}, {"arrows": "to", "from": "repository", "label": "DEPENDS_ON", "to": "code_understanging"}, {"arrows": "to", "from": "repository", "label": "DEPENDS_ON", "to": "graph"}, {"arrows": "to", "from": "search", "label": "DEPENDS_ON", "to": "database"}, {"arrows": "to", "from": "search", "label": "DEPENDS_ON", "to": "embedding"}]);

                  nodeColors = {};
                  allNodes = nodes.get({ returnType: "Object" });
                  for (nodeId in allNodes) {
                    nodeColors[nodeId] = allNodes[nodeId].color;
                  }
                  allEdges = edges.get({ returnType: "Object" });
                  // adding nodes and edges to the graph
                  data = {nodes: nodes, edges: edges};

                  var options = {
    "configure": {
        "enabled": false
    },
    "edges": {
        "color": {
            "inherit": true
        },
        "smooth": {
            "enabled": true,
            "type": "dynamic"
        }
    },
    "interaction": {
        "dragNodes": true,
        "hideEdgesOnDrag": false,
        "hideNodesOnDrag": false
    },
    "physics": {
        "enabled": true,
        "repulsion": {
            "centralGravity": 0.2,
            "damping": 0.09,
            "nodeDistance": 300,
            "springConstant": 0.05,
            "springLength": 300
        },
        "solver": "repulsion",
        "stabilization": {
            "enabled": true,
            "fit": true,
            "iterations": 1000,
            "onlyDynamicEdges": false,
            "updateInterval": 50
        }
    }
};

                  


                  

                  network = new vis.Network(container, data, options);

                  

                  

                  


                  

                  return network;

              }
              drawGraph();
        </script>
